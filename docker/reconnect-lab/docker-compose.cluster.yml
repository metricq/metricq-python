x-python-client-build: &python-client-build
  context: ../..
  dockerfile: docker/reconnect-lab/Dockerfile

services:
  metricq-manager:
    image: ghcr.io/metricq/metricq-manager:edge
    command: --couchdb-url http://couchdb-server:5984 --couchdb-user admin --couchdb-password admin amqp://admin:admin@rabbitmq-server/ vhost:/
    restart: unless-stopped
    depends_on:
      - rabbitmq-server-node0
      - couchdb-setup
    networks:
      - metricq-network

  # Three-node cluster. All nodes are aliased to the same "rabbitmq-server"
  # DNS name on the shared network, so clients connecting to that name get
  # round-robined across whichever nodes are currently up -- when a node
  # goes down, aio_pika's robust reconnect re-resolves DNS on its next
  # attempt and lands on a surviving node. Use the per-node aliases
  # (rabbitmq-node0/1/2) with chaos.sh to target one node specifically.
  rabbitmq-server-node0:
    build: ./rabbitmq-cluster-node
    image: metricq-reconnect-lab-rabbitmq-cluster-node
    hostname: rabbitmq-node0
    environment:
      RABBITMQ_NODENAME: "rabbit@rabbitmq-node0"
    networks:
      metricq-network:
        aliases:
          - rabbitmq-server
          - rabbitmq-node0
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  rabbitmq-server-node1:
    build: ./rabbitmq-cluster-node
    image: metricq-reconnect-lab-rabbitmq-cluster-node
    hostname: rabbitmq-node1
    environment:
      RABBITMQ_NODENAME: "rabbit@rabbitmq-node1"
    depends_on:
      - rabbitmq-server-node0
    networks:
      metricq-network:
        aliases:
          - rabbitmq-server
          - rabbitmq-node1
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"

  rabbitmq-server-node2:
    build: ./rabbitmq-cluster-node
    image: metricq-reconnect-lab-rabbitmq-cluster-node
    hostname: rabbitmq-node2
    environment:
      RABBITMQ_NODENAME: "rabbit@rabbitmq-node2"
    depends_on:
      - rabbitmq-server-node0
    networks:
      metricq-network:
        aliases:
          - rabbitmq-server
          - rabbitmq-node2
    ports:
      - "127.0.0.1:5674:5672"
      - "127.0.0.1:15674:15672"

  couchdb-server:
    image: couchdb:3
    environment:
      COUCHDB_USER: "admin"
      COUCHDB_PASSWORD: "admin"
    networks:
      - metricq-network
    ports:
      - "127.0.0.1:5984:5984"
    command: /opt/couchdb/bin/couchdb

  couchdb-setup:
    build: ./couchdb-setup
    image: metricq-reconnect-lab-couchdb-setup
    depends_on:
      - couchdb-server
    networks:
      - metricq-network

  source-py-dummy:
    build: *python-client-build
    image: metricq-reconnect-lab-client
    depends_on:
      - rabbitmq-server-node0
      - metricq-manager
      - couchdb-setup
    networks:
      - metricq-network
    restart: unless-stopped
    command: ["python", "examples/metricq_source.py", "--server", "amqp://admin:admin@rabbitmq-server/", "--token", "source-py-dummy", "-v", "DEBUG"]

  sink-py-dummy:
    build: *python-client-build
    image: metricq-reconnect-lab-client
    depends_on:
      - rabbitmq-server-node0
      - metricq-manager
      - couchdb-setup
    networks:
      - metricq-network
    restart: unless-stopped
    command: ["python", "examples/metricq_sink.py", "--server", "amqp://admin:admin@rabbitmq-server/", "--metric", "test.py.dummy", "-v", "DEBUG"]

  # DurableSink: fixed token (no UUID), registers via sink.register and gets
  # the *same* data queue back across restarts -- use this to compare against
  # sink-py-dummy's data-loss behaviour when killed for a while.
  sink-py-durable-dummy:
    build: *python-client-build
    image: metricq-reconnect-lab-client
    depends_on:
      - rabbitmq-server-node0
      - metricq-manager
      - couchdb-setup
    networks:
      - metricq-network
    restart: unless-stopped
    command: ["python", "examples/metricq_durable_sink.py", "--server", "amqp://admin:admin@rabbitmq-server/", "--metric", "test.py.dummy", "-v", "DEBUG"]

networks:
  metricq-network:
    driver: bridge
